<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">AT gold hallmark favicon</title>
  <desc id="desc">A simplified antique gold hallmark with AT monogram inside a wax-seal style circle.</desc>
  <defs>
    <radialGradient id="gold" cx="35%" cy="28%" r="72%">
      <stop offset="0%" stop-color="#fff1b8"/>
      <stop offset="38%" stop-color="#d6a238"/>
      <stop offset="72%" stop-color="#9b671d"/>
      <stop offset="100%" stop-color="#6f4615"/>
    </radialGradient>
    <linearGradient id="rim" x1="80" y1="72" x2="430" y2="440" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fff3bd"/>
      <stop offset="45%" stop-color="#c8942f"/>
      <stop offset="100%" stop-color="#694014"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#2b1606" flood-opacity=".28"/>
    </filter>
  </defs>

  <circle cx="256" cy="256" r="220" fill="url(#gold)" filter="url(#softShadow)"/>
  <circle cx="256" cy="256" r="205" fill="none" stroke="url(#rim)" stroke-width="20"/>
  <circle cx="256" cy="256" r="165" fill="none" stroke="#f7d77c" stroke-width="7" opacity=".9"/>
  <circle cx="256" cy="256" r="139" fill="none" stroke="#6d4214" stroke-width="5" opacity=".42"/>

  <g fill="#4b2b0d" opacity=".35">
    <circle cx="123" cy="211" r="8"/>
    <circle cx="386" cy="170" r="7"/>
    <circle cx="368" cy="356" r="9"/>
    <circle cx="155" cy="360" r="6"/>
    <circle cx="430" cy="259" r="5"/>
  </g>

  <text x="256" y="300"
        text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="142"
        font-weight="700"
        letter-spacing="-10"
        fill="#fff4bd"
        stroke="#51300d"
        stroke-width="5"
        paint-order="stroke fill">AT</text>

  <path d="M155 329c40 40 161 48 205-2" fill="none" stroke="#fff0aa" stroke-width="7" stroke-linecap="round" opacity=".45"/>
  <path d="M135 163c50-48 180-70 258 0" fill="none" stroke="#fff4bd" stroke-width="8" stroke-linecap="round" opacity=".32"/>
</svg>
